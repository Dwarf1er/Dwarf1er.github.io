<nav class="flex flex-row items-center w-full {{ if .IsHome }}justify-end{{ else }}justify-between gap-6{{ end }}" aria-label="Main">
  {{- if not .IsHome }}
  <div class="flex flex-col gap-1">
    <a href="{{ "/" | relLangURL }}" class="site-brand-name text-4xl font-bold hover:text-sky-400 whitespace-nowrap">{{ site.Params.siteName }}</a>
    <p class="site-tagline">{{ site.Params.catchPhrase }}</p>
  </div>
  {{- end }}

  <div id="site-menu" class="dropdown-menu flex flex-row absolute max-lg:w-full max-lg:items-center max-lg:justify-center max-lg:-top-full lg:static max-lg:bg-slate-900 max-lg:h-[calc(100dvh)] max-lg:left-0 z-50">
    <ul class="flex flex-col lg:flex-row gap-2 menu-list">
      {{ partial "default_menu.html" . }}
    </ul>
  </div>
  <button type="button" class="menu-toggle open-dropdown-button lg:hidden" aria-controls="site-menu" aria-label="{{ i18n "open_menu" }}">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 448 512" width="32" height="32" fill="white" aria-hidden="true">
      <path d="M0 96C0 78.3 14.3 64 32 64H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32C14.3 128 0 113.7 0 96zM0 256c0-17.7 14.3-32 32-32H416c17.7 0 32 14.3 32 32s-14.3 32-32 32H32c-17.7 0-32-14.3-32-32zM448 416c0 17.7-14.3 32-32 32H32c-17.7 0-32-14.3-32-32s14.3-32 32-32H416c17.7 0 32 14.3 32 32z" />
    </svg>
  </button>
  <button type="button" class="menu-toggle close-dropdown-button hidden z-50" aria-controls="site-menu" aria-label="{{ i18n "close_menu" }}">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" width="32" height="32" fill="white" aria-hidden="true">
      <path d="M342.6 150.6c12.5-12.5 12.5-32.8 0-45.3s-32.8-12.5-45.3 0L192 210.7 86.6 105.4c-12.5-12.5-32.8-12.5-45.3 0s-12.5 32.8 0 45.3L146.7 256 41.4 361.4c-12.5 12.5-12.5 32.8 0 45.3s32.8 12.5 45.3 0L192 301.3 297.4 406.6c12.5 12.5 32.8 12.5 45.3 0s12.5-32.8 0-45.3L237.3 256 342.6 150.6z" />
    </svg>
  </button>
</nav>
