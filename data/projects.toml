[[projects]]
  title = "forestair-ir-rs"
  tech = ["Rust", "ESP32", "Infrared", "Reverse engineering"]
  [[projects.links]]
    kind = "source"
    url = "https://github.com/Dwarf1er/forestair-ir-rs"
  [[projects.links]]
    kind = "talk"
    url = "https://www.youtube.com/watch?v=Zmq2x9Xt8Ak"
  [projects.en]
    summary = "The complete infrared protocol of an air conditioner remote, reverse-engineered and reimplemented in Rust on an ESP32."
    details = [
      "Captured the remote's signals with an IR receiver, dumped the payloads in hex, and compared them button by button to work out the protocol.",
      "Every feature of the original remote is supported, not just a few commands.",
      "Presented at Code @ Québec (talk in French).",
    ]
  [projects.fr]
    summary = "Reverse engineering du protocole infrarouge complet d'une télécommande de climatiseur, réimplémenté en Rust sur un ESP32."
    details = [
      "Capture des signaux avec un récepteur IR, dump des payloads en hex et comparaison bouton par bouton pour comprendre le protocole.",
      "Toutes les fonctions de la télécommande d'origine sont prises en charge, pas seulement quelques commandes.",
      "Présenté à Code @ Québec.",
    ]
